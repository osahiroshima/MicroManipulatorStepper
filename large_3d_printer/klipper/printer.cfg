# =============================================================================
# 大型 CoreXY 3D プリンター（350 x 350 x 350）Klipper 設定ひな形
# モーター: ST-42BYH1004-5013（0.9°, 1.0A, 5.0Ω, 11.5mH）
#
# このファイルはモーター・運動学に関する部分だけのひな形です。
# <...> の部分（ピン名など）は、使用する制御ボードの公式サンプル設定
# （Klipper リポジトリの config/generic-bigtreetech-octopus-*.cfg など）から
# 正しい値をコピーしてください。値が違うとモーターやヒーターが誤動作します。
# =============================================================================

[mcu]
serial: <ls /dev/serial/by-id/ で表示されるパス>

[printer]
kinematics: corexy
# 24V・0.8A でトルクを保てる上限の目安が約 140mm/s（tools/motor_speed_estimate.py）
max_velocity: 150
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

# -----------------------------------------------------------------------------
# X / Y（CoreXY の A・B モーター）
#   full_steps_per_rotation: 0.9° モーターなので 400（1.8° なら 200）
#   rotation_distance: GT2 ベルト(2mm ピッチ) x 20 歯 = 40mm
# -----------------------------------------------------------------------------
[stepper_x]
step_pin: <MOTOR0_STEP>
dir_pin: <MOTOR0_DIR>
enable_pin: !<MOTOR0_EN>
full_steps_per_rotation: 400
microsteps: 16
rotation_distance: 40
endstop_pin: <X_ENDSTOP>
position_endstop: 350
position_max: 350
homing_speed: 40
homing_retract_dist: 5

[tmc2209 stepper_x]
uart_pin: <MOTOR0_UART>
# 定格 1.0A に対して余裕を持たせる（発熱: 0.8^2 x 5Ω x 2相 ≒ 6.4W）
run_current: 0.8
# 0 = 常に SpreadCycle（高速時のトルクが出やすい。静音性は StealthChop に劣る）
stealthchop_threshold: 0
interpolate: False

[stepper_y]
step_pin: <MOTOR1_STEP>
dir_pin: <MOTOR1_DIR>
enable_pin: !<MOTOR1_EN>
full_steps_per_rotation: 400
microsteps: 16
rotation_distance: 40
endstop_pin: <Y_ENDSTOP>
position_endstop: 350
position_max: 350
homing_speed: 40
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: <MOTOR1_UART>
run_current: 0.8
stealthchop_threshold: 0
interpolate: False

# -----------------------------------------------------------------------------
# Z（ベッド昇降、3 点支持）
#   rotation_distance: T8 リード 2mm の台形ネジ = 2
# -----------------------------------------------------------------------------
[stepper_z]
step_pin: <MOTOR2_STEP>
dir_pin: <MOTOR2_DIR>
enable_pin: !<MOTOR2_EN>
full_steps_per_rotation: 400
microsteps: 16
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
position_max: 340
position_min: -5
homing_speed: 8

[tmc2209 stepper_z]
uart_pin: <MOTOR2_UART>
run_current: 0.6

[stepper_z1]
step_pin: <MOTOR3_STEP>
dir_pin: <MOTOR3_DIR>
enable_pin: !<MOTOR3_EN>
full_steps_per_rotation: 400
microsteps: 16
rotation_distance: 2

[tmc2209 stepper_z1]
uart_pin: <MOTOR3_UART>
run_current: 0.6

[stepper_z2]
step_pin: <MOTOR4_STEP>
dir_pin: <MOTOR4_DIR>
enable_pin: !<MOTOR4_EN>
full_steps_per_rotation: 400
microsteps: 16
rotation_distance: 2

[tmc2209 stepper_z2]
uart_pin: <MOTOR4_UART>
run_current: 0.6

# 3 本の Z の高さを自動で揃える。座標は実機の支点位置に合わせて変更する
[z_tilt]
z_positions:
    -50, 18     # Z  （左前）
    175, 398    # Z1 （中央後）
    400, 18     # Z2 （右前）
points:
    30, 5
    175, 330
    320, 5
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075

# -----------------------------------------------------------------------------
# エクストルーダー・ヒーター・プローブ・ファンなどは、使用する部品に合わせて
# ボードの公式サンプル設定とエクストルーダー／ホットエンドのマニュアルから追加する。
# 熱暴走保護（verify_heater）は絶対に無効にしないこと。
# -----------------------------------------------------------------------------
